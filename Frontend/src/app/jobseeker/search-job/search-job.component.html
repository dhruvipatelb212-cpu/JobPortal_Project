<div class="left-side-bar">
    <div class="brand-logo">
        <a href="index.html">
            <img src="assets/deskapp/vendors/images/deskapp-logo.svg" alt="" class="dark-logo">
            <img src="assets/deskapp/vendors/images/deskapp-logo-white.svg" alt="" class="light-logo">
        </a>
        <div class="close-sidebar" data-toggle="left-sidebar-close">
            <i class="ion-close-round"></i>
        </div>
    </div>
    <div class="menu-block customscroll">
        <div class="sidebar-menu">
            <ul id="accordion-menu">

                <a routerLink="/jobseeker" class="dropdown-toggle no-arrow">
                    <span class="micon dw dw-house-1"></span><span class="mtext">Home</span>
                </a>


                <li class="dropdown">
                    <a routerLink="/jobseeker/SearchJob" class="dropdown-toggle no-arrow">
                        <span class="micon dw dw-briefcase"></span><span class="mtext">Search Jobs</span>
                    </a>

                </li>
                <li class="dropdown">
                    <a routerLink="/jobseeker/ViewApplication" class="dropdown-toggle no-arrow">
                        <span class="micon dw dw-library"></span><span class="mtext">View Applications</span>
                    </a>

                </li>
                <li>
                    <a routerLink="/jobseeker/JsProfile" class="dropdown-toggle no-arrow">
                        <span class="micon fa fa-user"></span><span class="mtext">Profile</span>
                    </a>
                </li>


                <li>
                    <a routerLink="/jobseeker/JsFeedback" class="dropdown-toggle no-arrow">
                        <span class="micon fa fa-star"></span><span class="mtext">Feedback</span>
                    </a>
                </li>

                <li>
                    <a class="dropdown-toggle no-arrow" (click)="remove()" style="color: white;">
                        <span class="micon dw dw-logout1"></span><span class="mtext">Logout</span>
                    </a>
                </li>


            </ul>
        </div>
    </div>
</div>




<div class="col-lg-12 row bg-light">

    <b><label class="form-control-plaintext" style="font-size: 20px;margin-top: 50px;margin-left:290px;">Companies:&nbsp;&nbsp; </label></b>
    <select class="form-control" style="margin-top: 50px;width:200px;" name="ap" [(ngModel)]="cmpId">
        
        <option *ngFor="let data of allCmps" value="{{data.user_id}}" >{{data.full_name}}</option>
        
    </select>&nbsp;



    <b><label class="form-control-plaintext" style="font-size: 20px;margin-left: 20px;margin-top: 50px;">Experience:&nbsp;&nbsp; </label></b>
    <select class="form-control" style="margin-top: 50px;width:200px;" name="ap" [(ngModel)]="Exp">
        
        <option *ngFor="let data of allJobEx" value="{{data.Experience}}" >{{data.Experience}}</option>
        
    </select>&nbsp;



    <b><label class="form-control-plaintext" style="font-size: 20px;margin-left: 20px;margin-top: 50px;">Job Type : &nbsp;&nbsp; </label></b>
    <select class="form-control" style="margin-top: 50px;width:200px;" name="ap" [(ngModel)]="jType">
        
        <option>Full Time</option>
        <option>Part Time</option>
        <option>Internship</option>
        
    </select>&nbsp;&nbsp;
    <button type="submit" (click)="getFilterJobs()" style="margin-top: 50px;" class="micon dw dw-search btn btn-primary"></button>

</div>

<section class="ftco-section bg-light">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="row justify-content-center pb-3">
                    <div class="col-md-12 heading-section" style="margin-left: 180px;margin-top: -60px;">
                        <span class="subheading">Recently Added Jobs</span>
                        <h2 class="mb-4">Hot Jobs</h2>
                        <hr style="border:2px solid black;" />
                    </div>
                </div>
                <div class="row">


                    <table *ngFor="let data of allJobs" style="border-color: transparent;border-width: 0px;width: 100%;">
                        <div class="col-md-12" style="margin-left: 90px;">
                            <div class="job-post-item py-4 d-block d-lg-flex align-items-center">

                                <table>
                                    <tr>
                                        <td>
                                            <h2 class="mr-3 text-black">
                                                <label style="width: 600px;">{{data.Title}}</label>
                                            </h2>
                                            <div class="mr-3">
                                                {{data.Field_type}} : <label style="color:red; ">{{data.Desc_job}}</label><br/>
                                                <label style="color: limegreen;">Experience : {{data.Experience}}</label>
                                            </div>
                                        </td>

                                        <td>
                                            <div class="one-forth ml-auto d-flex align-items-center">
                                                <div style="margin-left: 80px;">
                                                    <a class="icon text-center d-flex justify-content-center align-items-center icon mr-2">
                                                        <span class="icon-heart"></span>
                                                    </a>
                                                </div><button class="btn  btn-primary" (click)="addApplicationApply(data)" style="width: 120px;">Apply</button>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="badge-wrap" style="margin-left: -410px;">
                                                <span class="bg-warning text-white badge py-2 px-3">
                                                    <label>{{data.Job_type}}</label>
                                                </span>
                                            </div>
                                        </td>

                                    </tr>
                                    <tr>
                                        <td>
                                            <div class="mr-3">
                                                <span class="icon-layers "></span>

                                                <label style="color: blue; ">{{data.full_name}}</label>
                                            </div>

                                        </td>
                                        <td>
                                            <div class="mr-3">
                                                <span class="icon-my_location" style="margin-left: -350px;"></span>
                                                <label>{{data.Location}}</label>
                                            </div>
                                        </td>

                                        <td>
                                            <div>
                                                <span class="icon-account_balance_wallet" style="margin-left: -630px;"></span>
                                                <label style="width: 400px;">{{data.Salary_range}}</label>
                                            </div>
                                        </td>




                                    </tr>
                                </table>
                            </div>
                        </div>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

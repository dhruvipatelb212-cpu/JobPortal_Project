<div class="left-side-bar">
    <div class="brand-logo">
        <a href="index.html">
            <img src="assets/deskapp/vendors/images/deskapp-logo.svg" alt="" class="dark-logo">
            <img src="assets/deskapp/vendors/images/deskapp-logo-white.svg" alt="" class="light-logo">
        </a>
        <div class="close-sidebar" data-toggle="left-sidebar-close">
            <i class="ion-close-round"></i>
        </div>
    </div>
    <div class="menu-block customscroll">
        <div class="sidebar-menu">
            <ul id="accordion-menu">
                <li>
                    <a routerLink="/admin" class="dropdown-toggle no-arrow">
                        <span class="micon dw dw-house-1"></span><span class="mtext">Home</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/admin/ViewCompanies" class="dropdown-toggle no-arrow">
                        <span class="micon dw dw-library"></span><span class="mtext">Companies</span>
                    </a>
                </li>
                <li>
                    <a routerLink="/admin/ViewJS" class="dropdown-toggle no-arrow">
                        <span class="micon fa fa-users"></span><span class="mtext">JobSeekers</span>
                    </a>
                </li>

                <li>
                    <a routerLink="/admin/Profile" class="dropdown-toggle no-arrow">
                        <span class="micon fa fa-user"></span><span class="mtext">Change Password</span>
                    </a>
                </li>

                <li>
                    <a routerLink="/admin/ViewFeedback" class="dropdown-toggle no-arrow">
                        <span class="micon fa fa-star"></span><span class="mtext">Feedback</span>
                    </a>
                </li>


                <li>
                    <a (click)="remove()" class="dropdown-toggle no-arrow" style="color: white;">
                        <span class="micon dw dw-logout1"></span><span class="mtext">Logout</span>
                    </a>

                </li>


            </ul>
        </div>
    </div>
</div>

<div class="col-lg-12 row bg-light">
    <b><label class="form-control-plaintext" style="font-size: 20px;margin-left: 290px;margin-top: 50px;">Search :&nbsp;&nbsp; </label></b>
    <select [(ngModel)]="search" class="form-control col-md-3 mr-2" style="margin-top: 50px;" name="ap">
        <option>--select--</option>
        <option value="C">Companie's Feedback</option>
        <option value="J">JobSeeker's Feedback</option>
       
    </select>
    <button (click)="filter()" type="submit" style="margin-top: 50px;" class="micon dw dw-search btn btn-primary"></button>
</div>

<div class="card-box" style="margin-top: 5px;">
    <div class="pd-5">
        <h4 style="margin-left: 800px;margin-top: 50px;" class="text-blue h4">User's Feedback List</h4>
    </div>

    <table style="width: 1160px;margin-left: 320px;" class="data-table table hover multiple-select-row nowrap">
        <thead>
            <tr>
                <th>User Name</th>
                <th>No Of Star</th>
                <hr style="border-style: 2px solid black;" />
            </tr>
        </thead>
        <tr *ngFor="let data of allFeedBack">
            <td>
                <h6><label>{{data.full_name}}</label></h6>
            </td>
            <td>

                <h6>
                    {{data.comment}}
                    <label class="icon icon-star "></label>
                </h6>
            </td>
        </tr>
    </table>
</div>
